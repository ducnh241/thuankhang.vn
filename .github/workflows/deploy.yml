# Đặt file này vào repo GitHub tại: .github/workflows/deploy.yml
# main  -> thuankhang.vn
# dev   -> dev.thuankhang.vn
#
# Secrets cần tạo trong repo (Settings -> Secrets and variables -> Actions):
#   SSH_PRIVATE_KEY : private key deploy (ed25519)
#   SSH_USER        : aweschnghosting
#   SSH_HOST        : 103.75.186.15
#   SSH_PORT        : 65333

name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: ${{ github.ref_name == 'main' && 'domains/thuankhang.vn' || 'domains/dev.thuankhang.vn' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Composer install
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload code (rsync)
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='document/' \
            --exclude='claude/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.TARGET_DIR }}/

      - name: Run Laravel commands on server
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ env.TARGET_DIR }} &&
            php artisan down --retry=15 || true;
            php artisan migrate --force &&
            php artisan optimize:clear &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache;
            php artisan up
          "
